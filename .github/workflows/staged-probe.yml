name: Staged Official Source Probes

on:
  schedule:
    - cron: '21 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - probe_staged_sources.py
      - civicplus_bids.py
      - granicus_rfps.py
      - robots_policy.py
      - test_granicus_rfps.py
      - test_civicplus_bids.py
      - test_staged_probes.py
      - test_staged_municipal_sources.py
      - test_waverly_staging.py
      - '.github/workflows/staged-probe.yml'
      - sources.json

permissions:
  contents: read

concurrency:
  group: staged-probes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_staged_probes test_staged_municipal_sources test_waverly_staging test_granicus_rfps test_civicplus_bids -v

  probe:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe staged official pages (no source activation)
        run: python probe_staged_sources.py
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/staged_probes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update staged official source probe diagnostics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
