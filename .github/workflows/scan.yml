name: Automatic Contract Radar Scanner

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - sources.json
      - '.github/workflows/scan.yml'

permissions:
  contents: read

concurrency:
  group: contract-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dashboard behavior
        run: node test_website.js
      - name: Run offline regression tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

  scan-contracts:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Run contract scanner
        run: python scan.py
      - name: Validate generated feed and history
        run: python validate_output.py
      - name: Save results and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunities.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update contract leads and history'
            # A staged probe or another workflow may have updated main while
            # this scan ran. Rebase rather than losing the scheduled result to
            # a non-fast-forward push; genuine data conflicts still fail closed.
            # Another scheduled workflow may publish between rebase and push.
            # Retry only optimistic, non-force pushes; a genuine rebase
            # conflict still fails closed rather than overwriting data.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish after five non-force attempts" >&2
                exit 1
              fi
              sleep "$attempt"
            done
          fi
