name: Automatic Contract Radar Scanner
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contract-radar-scanner
  cancel-in-progress: false
jobs:
  scan-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Run offline scanner tests
        run: python -m unittest discover -s tests -v
      - name: Run contract scanner
        run: python scan.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/opportunities.json').read_text())
          h=json.loads(Path('data/history.json').read_text())
          assert isinstance(d['opportunities'],list)
          assert len(d['source_status'])>=102
          assert isinstance(h['opportunities'],dict)
          print('Leads:',len(d['opportunities']),'Historical leads:',len(h['opportunities']))
          PY
      - name: Save results and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunities.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update contract leads and history'
            git push
          fi
